<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" fill="none">
  <!-- Saime Kitchen & Bar Official Favicon -->
  <g fill="none" stroke="#e52b28" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <!-- Orbital Ring Back Loop -->
    <path 
      d="M 230 580 C 130 650, 200 730, 380 690 C 530 660, 710 540, 780 430 C 820 370, 780 330, 680 340 C 580 350, 420 440, 230 580 Z" 
    />
    
    <!-- Central Leaf / Diamond Outer Boundary -->
    <path 
