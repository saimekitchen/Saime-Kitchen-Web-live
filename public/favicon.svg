      d="M 230 580 C 185 640, 225 710, 360 710 C 445 710, 540 670, 620 610" 
    />
  </g>

  <!-- Solid Coffee Bean -->
  <g transform="translate(680, 535) rotate(-35)">
    <ellipse cx="0" cy="0" rx="98" ry="148" fill="#e52b28" />
    <path 
      d="M 0 -105 C -30 -50, 30 10, 0 105" 
